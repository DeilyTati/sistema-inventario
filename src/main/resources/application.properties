spring.application.name=sistema-inventario

# Puerto dinámico: asignado por Render ($PORT) o 8081 por defecto en local
server.port=${PORT:8081}

# =====================================================
# CONFIGURACIÓN DE BASE DE DATOS (AIVEN MYSQL / NUBE)
# =====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql-120ccb7a-deilytati19-a530.c.aivencloud.com}:${DB_PORT:17485}/${DB_NAME:defaultdb}?sslMode=PREFERRED&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# CONFIGURACIÓN DE SPRING DATA JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect