spring.application.name=sistema-inventario

# Puerto dinámico: asignado por Render ($PORT) o 8081 por defecto en local
server.port=${PORT:8081}

# =====================================================
# CONFIGURACIÓN DE BASE DE DATOS (ORACLE CLOUD / LOCAL)
# =====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sistema_inventario}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:19Sep2002}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# CONFIGURACIÓN DE SPRING DATA JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false